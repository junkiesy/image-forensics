services:
  backend:
    build:
      context: ./backend
    container_name: image-forensics-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./datasets:/datasets
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
    container_name: image-forensics-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
